name: Android APK build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Validate version numbering
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set stable version
        run: python3 scripts/android_version.py

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports and UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-ui
          path: |
            app/build/reports/tests
            app/build/reports/screenshots
            app/build/test-results
          if-no-files-found: warn

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: error

      - name: Restore temporary signing keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          for key in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'):
              if not os.environ.get(key):
                  raise SystemExit('Missing signing secret: ' + key)
          directory = Path(os.environ['RUNNER_TEMP']) / 'test-dialer-signing'
          directory.mkdir(mode=0o700, exist_ok=True)
          try:
              data = base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True)
          except Exception:
              raise SystemExit('Invalid keystore encoding') from None
          (directory / 'keystore.jks').write_bytes(data)
          PY
          keytool -exportcert -keystore "$RUNNER_TEMP/test-dialer-signing/keystore.jks"             -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS"             -file "$RUNNER_TEMP/test-dialer-signing/certificate.der" >/dev/null 2>&1

      - name: Build stable signed APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/test-dialer-signing/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify stable signature and application identity
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Test-Dialer-${TEST_DIALER_VERSION_CODE}.apk"
          python3 scripts/verify_android_apk.py "dist/Test-Dialer-${TEST_DIALER_VERSION_CODE}.apk"

      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/test-dialer-signing"

      - name: Upload stable phone APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: test-dialer-stable-apk
          path: dist/
          if-no-files-found: error
